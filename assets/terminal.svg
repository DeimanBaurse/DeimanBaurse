<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="422" viewBox="0 0 1200 422" role="img" aria-labelledby="title desc"><title id="title">Adventure console</title><desc id="desc">A pixel RPG command log introducing Deiman and his game design interests. The console is a visual introduction.</desc><path d="M 8 0 H 1192 V 8 H 1200 V 414 H 1192 V 422 H 8 V 414 H 0 V 8 H 8 Z" fill="#596480"/><path d="M 10 4 H 1190 V 10 H 1196 V 412 H 1190 V 418 H 10 V 412 H 4 V 10 H 10 Z" fill="#141b2b"/><rect x="16" y="16" width="1168" height="2" fill="#313e58"/><rect x="24" y="24" width="1152" height="374" fill="#101827"/><rect x="42" y="44" width="10" height="10" fill="#f3c578"/><rect x="64" y="44" width="10" height="10" fill="#9bceb5"/><rect x="86" y="44" width="10" height="10" fill="#aea5db"/><text x="482" y="58" fill="#f3c578" font-size="18" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">ADVENTURE CONSOLE</text><rect x="42" y="78" width="1116" height="2" fill="#313e58"/><text x="42" y="120" fill="#f3c578" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">deiman@camp ~ $ whoami</text><text x="42" y="154" fill="#fff0d2" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">Deiman / game design enthusiast</text><text x="42" y="200" fill="#f3c578" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">deiman@camp ~ $ ./focus</text><text x="42" y="234" fill="#bcc9de" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">Game mechanics, worldbuilding &amp; prototypes</text><text x="42" y="280" fill="#f3c578" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">deiman@camp ~ $ ./next</text><text x="42" y="314" fill="#9bceb5" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">Turn an idea into something playable.</text><text class="console-typing" x="42" y="372" fill="#f3c578" font-size="24" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">deiman@camp ~ $ </text><rect class="console-cursor" x="266" y="349" width="13" height="27" fill="#fff0d2"/></svg>