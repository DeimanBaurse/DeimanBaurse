<svg xmlns="http://www.w3.org/2000/svg" width="600" height="604" viewBox="0 0 600 604" role="img" aria-labelledby="title desc"><title id="title">Adventure console</title><desc id="desc">A pixel RPG command log introducing Deiman and his game design interests. The console is a visual introduction.</desc><path d="M 8 0 H 592 V 8 H 600 V 596 H 592 V 604 H 8 V 596 H 0 V 8 H 8 Z" fill="#596480"/><path d="M 10 4 H 590 V 10 H 596 V 594 H 590 V 600 H 10 V 594 H 4 V 10 H 10 Z" fill="#141b2b"/><rect x="16" y="16" width="568" height="2" fill="#313e58"/><rect x="24" y="24" width="552" height="556" fill="#101827"/><rect x="42" y="44" width="10" height="10" fill="#f3c578"/><rect x="64" y="44" width="10" height="10" fill="#9bceb5"/><rect x="86" y="44" width="10" height="10" fill="#aea5db"/><text x="174" y="58" fill="#f3c578" font-size="18" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">ADVENTURE CONSOLE</text><rect x="42" y="78" width="516" height="2" fill="#313e58"/><text x="42" y="120" fill="#f3c578" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">deiman@camp ~ $ whoami</text><text x="42" y="158" fill="#fff0d2" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">Deiman / game design</text><text x="42" y="192" fill="#fff0d2" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">enthusiast</text><text x="42" y="250" fill="#f3c578" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">deiman@camp ~ $ ./focus</text><text x="42" y="288" fill="#bcc9de" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">Game mechanics &amp; worldbuilding</text><text x="42" y="322" fill="#bcc9de" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">Prototypes &amp; playful ideas</text><text x="42" y="380" fill="#f3c578" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">deiman@camp ~ $ ./next</text><text x="42" y="418" fill="#9bceb5" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">Turn an idea into</text><text x="42" y="452" fill="#9bceb5" font-size="24" font-weight="400" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">something playable.</text><text class="console-typing" x="42" y="538" fill="#f3c578" font-size="24" font-family="Cascadia Mono,Consolas,DejaVu Sans Mono,monospace">deiman@camp ~ $ </text><rect class="console-cursor" x="266" y="515" width="13" height="27" fill="#fff0d2"/></svg>